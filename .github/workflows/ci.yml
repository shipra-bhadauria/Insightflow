name: InsightFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test core tools import
        run: |
          python -c "from tools.describe import describe_data; print('describe_data OK')"
          python -c "from tools.aggregate import aggregate; print('aggregate OK')"
          python -c "from tools.chart import make_chart, make_plotly_chart; print('chart OK')"
          python -c "from tools.quality import run_quality_report; print('quality OK')"
          python -c "from tools.detect_columns import detect_columns; print('detect_columns OK')"
          python -c "from tools.trend import trend_over_time; print('trend OK')"
          python -c "from tools.anomaly import detect_anomaly; print('anomaly OK')"
          python -c "from tools.correlate import correlate; print('correlate OK')"
          python -c "from tools.what_if import what_if; print('what_if OK')"
          python -c "from tools.forecast import forecast; print('forecast OK')"

      - name: Test agents import
        run: |
          python -c "from agents.planner import planner_node; print('planner OK')"
          python -c "from agents.analyst import analyst_node, _build_dashboard_steps; print('analyst OK')"
          python -c "from agents.critic import critic_node; print('critic OK')"
          python -c "from agents.reporter import reporter_node; print('reporter OK')"
          python -c "from agents.retrieval import retrieval_node; print('retrieval OK')"

      - name: Test memory + cache + router
        run: |
          python -c "from memory.chroma_store import save_analysis_chroma, search_similar_chroma; print('chroma_store OK')"
          python -c "from llm_cache import get_cached, set_cache; print('llm_cache OK')"
          python -c "from router import route_query; print('router OK')"
          python -c "from logger import setup_logging; print('logger OK')"

      - name: Test workflow graph builds
        run: |
          python -c "from graph.workflow import workflow; print('workflow graph OK')"

      - name: Test state schema
        run: |
          python -c "from state import new_state, InsightFlowState, CriticVerdict; s = new_state(question='test', dataset_path='test.csv'); print('state OK')"

      - name: Test API starts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "from api.main import app; print('FastAPI app OK')"

      - name: Run eval harness (smoke test)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tests/eval_runner.py || echo "Eval harness completed (non-blocking)"
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t insightflow .
          echo "Docker build OK"
