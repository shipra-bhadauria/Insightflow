name: InsightFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test tools
        run: |
          python -c "from tools.describe import describe_data; print('describe_data OK')"
          python -c "from tools.aggregate import aggregate; print('aggregate OK')"
          python -c "from tools.quality import run_quality_report; print('quality OK')"
          python -c "from tools.detect_columns import detect_columns; print('detect_columns OK')"
          python -c "from memory.embeddings import EMBEDDING_DIM; print(f'embeddings OK — dim {EMBEDDING_DIM}')"
          python -c "from memory.faiss_store import get_memory_stats; print('faiss_store OK')"
          python -c "from tools.mcp_server import list_tools; print(f'mcp_server OK — {len(list_tools())} tools')"

      - name: Test API starts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "from api.main import app; print('FastAPI app OK')"

      - name: Test state schema
        run: |
          python -c "from state import new_state, InsightFlowState; s = new_state(question='test', dataset_path='test.csv'); print('state OK')"

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t insightflow .
          echo "Docker build OK"